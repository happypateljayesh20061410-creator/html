 <!DOCTYPE html>
<html>
<head>
<title>Student Registration Form</title>
</head>
<body bgcolor="#D3EEFF">

<center>
<h1><font color="#005385">Student Registration Form</font color="#005385"></h1>
<hr width=40% size="5"></hr>
<form>
<table border="1" cellpadding="8" cellspacing="0" width="40%">
<tr bgcolor="#ADE0FF">
<th colspan="2"><font size="5">Personal Information</font></th>
</tr>
<tr bgcolor="white">
<td>Full Name</td>
<td><input type="text" placeholder="Enter your name" size="30"></td>
</tr>

<tr bgcolor="white">
<td>Password</td>
<td><input type="password" size="30"></td>
</tr>
<tr bgcolor="white">
<td>Email</td>
<td><input type="email" size="30"></td>
</tr>
<tr bgcolor="white">
<td>Age</td>
<td><input type="number"></td>
</tr>
<tr bgcolor="white">
<td>Date of Birth</td>
<td><input type="date"></td>
</tr>

<tr bgcolor="#ADE0FF">
<th colspan="2"><font size="5">Course Details</font></th>
</tr>

<tr bgcolor="white">
<td>Gender</td>
<td>
<input type="radio" name="gender"> Male
<input type="radio" name="gender"> Female
<input type="radio" name="gender"> Other
</td>
</tr>
<tr bgcolor="white">
<td>Skills</td>
<td>
<input type="checkbox"> HTML
<input type="checkbox"> CSS
<input type="checkbox"> JavaScript
<input type="checkbox"> Python
</td>
</tr>

<tr bgcolor="white">
<td>Select Course</td>
<td>
<select>
<option>Select Course</option>
<option>BCA</option>
<option>BSc IT</option>
<option>B.Tech</option>
<option>MCA</option>
</select>
</td>
</tr>

<tr bgcolor="white">
<td>Upload Photo</td>
<td><input type="file"></td>
</tr>

 <tr bgcolor="#ADE0FF">
<th colspan="2"><font size="5">Address</font></th>
</tr>

<tr bgcolor="white">
<td>Address</td>
<td>
<textarea rows="5" cols="40" placeholder="Enter your address"></textarea>
</td>
</tr>

<tr bgcolor="white">
                <td colspan="2" align="center">
<input type="submit" value="Submit">
<input type="reset" value="Reset">
</td>
</tr>

</table>
</form>
</center>

</body>
</html>
